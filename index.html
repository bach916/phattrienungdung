<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxury Watch Store - 2026 Collection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .watch-card:hover img { transform: scale(1.1); }
    </style>
</head>
<body class="bg-gray-50 text-slate-900">

    <nav class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-gray-100">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="#" class="text-2xl font-black tracking-tighter">TIMELESS<span class="text-blue-600">.</span></a>
            <div class="flex items-center space-x-5">
                <a href="admin.html" class="text-sm font-medium hover:text-blue-600 transition">Quản trị</a>
                <button onclick="toggleCart()" class="relative p-2 bg-slate-900 text-white rounded-full hover:bg-slate-800 transition">
                    <i class="fa-solid fa-cart-shopping text-sm"></i>
                    <span id="cart-count" class="absolute -top-1 -right-1 bg-blue-500 text-[10px] w-5 h-5 flex items-center justify-center rounded-full border-2 border-white">0</span>
                </button>
            </div>
        </div>
    </nav>

    <header class="py-16 px-6 bg-slate-900 text-white text-center">
        <span class="text-blue-400 font-bold tracking-[0.2em] text-sm uppercase">Limited Edition</span>
        <h1 class="text-5xl font-black mt-2 mb-4">KIỆT TÁC THỜI GIAN</h1>
        <p class="text-slate-400 max-w-2xl mx-auto">Khám phá 14 mẫu đồng hồ biểu tượng được tích hợp sẵn từ hệ thống dữ liệu Cloud Firestore.</p>
    </header>

    <main class="container mx-auto px-6 py-12">
        <div id="product-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
            <div class="col-span-full text-center py-20">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-600 border-t-transparent"></div>
                <p class="mt-4 text-gray-500">Đang đồng bộ dữ liệu Firebase...</p>
            </div>
        </div>
    </main>

    <div id="cart-modal" class="fixed inset-0 bg-black/60 hidden z-[60] backdrop-blur-sm">
        <div class="absolute right-0 top-0 h-full w-full max-w-md bg-white shadow-2xl flex flex-col">
            <div class="p-6 border-b flex justify-between items-center">
                <h3 class="text-xl font-bold">GIỎ HÀNG</h3>
                <button onclick="toggleCart()" class="text-3xl">&times;</button>
            </div>
            <div id="cart-items" class="flex-grow p-6 overflow-y-auto space-y-4"></div>
            <div class="p-6 border-t bg-gray-50">
                <div class="flex justify-between text-2xl font-black mb-6">
                    <span>Tổng tiền:</span>
                    <span id="cart-total" class="text-blue-600">0đ</span>
                </div>
                <button class="w-full bg-slate-900 text-white py-4 rounded-xl font-bold hover:bg-blue-600 transition uppercase tracking-widest">Thanh toán ngay</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCjxu5VM_FU39wHu2kwVHuw6WMLqpshvw8",
            authDomain: "watch-store-8330b.firebaseapp.com",
            projectId: "watch-store-8330b",
            storageBucket: "watch-store-8330b.firebasestorage.app",
            messagingSenderId: "473256087916",
            appId: "1:473256087916:web:fc82fd400ba3dff01ce349"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const container = document.getElementById('product-container');

        // 14 Dữ liệu mẫu cực đẹp
        const dummyData = [
            { name: "Rolex Submariner Date", price: 350000000, image: "https://images.unsplash.com/photo-1542496658-e33a6d0d50f6?auto=format&fit=crop&w=800" },
            { name: "Omega Speedmaster", price: 185000000, image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=800" },
            { name: "Patek Philippe Nautilus", price: 2100000000, image: "https://images.unsplash.com/photo-1614164185128-e4ec99c436d7?auto=format&fit=crop&w=800" },
            { name: "Seiko Prospex Save Ocean", price: 12500000, image: "https://images.unsplash.com/photo-1524592094714-0f0654e20314?auto=format&fit=crop&w=800" },
            { name: "Tissot Le Locle Classic", price: 15800000, image: "https://images.unsplash.com/photo-1533139502658-0198f920d8e8?auto=format&fit=crop&w=800" },
            { name: "Cartier Santos Dumont", price: 145000000, image: "https://images.unsplash.com/photo-1508685096489-7aacd43bd3b1?auto=format&fit=crop&w=800" },
            { name: "IWC Portugieser Blue", price: 215000000, image: "https://images.unsplash.com/photo-1547996160-81dfa63595aa?auto=format&fit=crop&w=800" },
            { name: "Grand Seiko Heritage", price: 135000000, image: "https://images.unsplash.com/photo-1619134769735-51975975837d?auto=format&fit=crop&w=800" },
            { name: "Hublot Big Bang Unico", price: 480000000, image: "https://images.unsplash.com/photo-1612817159949-195b6eb9e31a?auto=format&fit=crop&w=800" },
            { name: "Longines Master Col.", price: 55000000, image: "https://images.unsplash.com/photo-1617345311027-4f964299b802?auto=format&fit=crop&w=800" },
            { name: "Tag Heuer Carrera", price: 95000000, image: "https://images.unsplash.com/photo-1585123334904-845d60e97b29?auto=format&fit=crop&w=800" },
            { name: "Zenith El Primero", price: 220000000, image: "https://images.unsplash.com/photo-1548171916-042ad9ec579a?auto=format&fit=crop&w=800" },
            { name: "Breitling Navitimer", price: 195000000, image: "https://images.unsplash.com/photo-1622434641406-a158123450f9?auto=format&fit=crop&w=800" },
            { name: "Tudor Black Bay 58", price: 88000000, image: "https://images.unsplash.com/photo-1615655093950-398d50611383?auto=format&fit=crop&w=800" }
        ];

        // Tự động nạp dữ liệu nếu trống
        async function autoSeed() {
            const snap = await getDocs(collection(db, "watches"));
            if (snap.empty) {
                for (const watch of dummyData) {
                    await addDoc(collection(db, "watches"), watch);
                }
            }
        }
        autoSeed();

        // Hiển thị sản phẩm real-time
        onSnapshot(collection(db, "watches"), (snapshot) => {
            container.innerHTML = "";
            snapshot.forEach((doc) => {
                const item = doc.data();
                container.innerHTML += `
                    <div class="bg-white rounded-2xl p-4 shadow-sm hover:shadow-2xl transition-all group watch-card border border-gray-100">
                        <div class="overflow-hidden rounded-xl h-60 bg-gray-50 mb-4">
                            <img src="${item.image}" class="w-full h-full object-cover transition duration-500">
                        </div>
                        <h3 class="font-bold text-gray-800 line-clamp-1">${item.name}</h3>
                        <div class="flex justify-between items-center mt-4">
                            <span class="text-blue-600 font-black">${item.price.toLocaleString()}đ</span>
                            <button onclick="addToCart('${item.name}', ${item.price})" class="bg-slate-900 text-white w-10 h-10 rounded-lg hover:bg-blue-600 transition flex items-center justify-center">
                                <i class="fa-solid fa-plus text-xs"></i>
                            </button>
                        </div>
                    </div>
                `;
            });
        });

        // Giỏ hàng
        window.cart = [];
        window.toggleCart = () => document.getElementById('cart-modal').classList.toggle('hidden');
        window.addToCart = (name, price) => {
            cart.push({name, price});
            renderCart();
            if(document.getElementById('cart-modal').classList.contains('hidden')) toggleCart();
        };

        function renderCart() {
            const list = document.getElementById('cart-items');
            document.getElementById('cart-count').innerText = cart.length;
            list.innerHTML = cart.map((item, index) => `
                <div class="flex justify-between items-center bg-gray-50 p-4 rounded-xl">
                    <div><p class="font-bold text-sm">${item.name}</p><p class="text-blue-600">${item.price.toLocaleString()}đ</p></div>
                    <button onclick="cart.splice(${index},1); renderCart()" class="text-red-400 p-2"><i class="fa-solid fa-trash"></i></button>
                </div>
            `).join('');
            const total = cart.reduce((sum, i) => sum + i.price, 0);
            document.getElementById('cart-total').innerText = total.toLocaleString() + "đ";
        }
    </script>
</body>
</html>
