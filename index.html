<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WatchStore - Đồng Hồ Cao Cấp</title>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <style>
    :root {
      --primary: #c3996b;
      --dark: #111;
      --light: #f8f1e9;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: var(--light);
      color: #333;
      line-height: 1.6;
    }
    header {
      background: var(--dark);
      color: white;
      padding: 1rem 5%;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--primary);
    }
    nav a {
      color: white;
      margin: 0 15px;
      text-decoration: none;
    }
    .cart-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 30px;
      cursor: pointer;
      font-weight: bold;
    }
    .hero {
      background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://source.unsplash.com/random/1600x900/?luxury-watch') center/cover no-repeat;
      height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: white;
    }
    .hero h1 {
      font-size: 4rem;
      margin-bottom: 1rem;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 5%;
    }
    .filters {
      display: flex;
      gap: 15px;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }
    .filters select, .filters input {
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
    }
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 25px;
    }
    .product-card {
      background: white;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      transition: transform 0.3s;
    }
    .product-card:hover {
      transform: translateY(-10px);
    }
    .product-card img {
      width: 100%;
      height: 280px;
      object-fit: cover;
    }
    .product-info {
      padding: 1.2rem;
    }
    .product-info h3 {
      margin: 0.5rem 0;
      color: var(--dark);
    }
    .brand {
      color: var(--primary);
      font-weight: bold;
    }
    .price {
      font-size: 1.4rem;
      font-weight: bold;
      color: #e63939;
      margin: 10px 0;
    }
    .add-to-cart {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    .cart-modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .cart-content {
      background: white;
      width: 90%;
      max-width: 600px;
      border-radius: 15px;
      padding: 2rem;
      max-height: 80vh;
      overflow-y: auto;
    }
    footer {
      background: var(--dark);
      color: white;
      text-align: center;
      padding: 3rem 0;
      margin-top: 4rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">WatchStore</div>
    <nav>
      <a href="#">Trang chủ</a>
      <a href="#">Sản phẩm</a>
      <a href="#">Thương hiệu</a>
    </nav>
    <button class="cart-btn" onclick="showCart()">🛒 Giỏ hàng (<span id="cart-count">0</span>)</button>
  </header>

  <section class="hero">
    <div>
      <h1>Đồng Hồ Đẳng Cấp</h1>
      <p>Khám phá bộ sưu tập đồng hồ sang trọng nhất năm 2026</p>
      <button onclick="document.getElementById('products').scrollIntoView({behavior: 'smooth'})" 
              style="margin-top:20px; padding:15px 40px; font-size:1.1rem; background:var(--primary); border:none; border-radius:50px; color:white; cursor:pointer;">
        Mua ngay
      </button>
    </div>
  </section>

  <div class="container">
    <h2 style="text-align:center; margin-bottom:2rem; color:var(--dark);">Sản phẩm nổi bật</h2>

    <div class="filters">
      <input type="text" id="search" placeholder="Tìm kiếm đồng hồ..." onkeyup="filterProducts()">
      <select id="brandFilter" onchange="filterProducts()" title="Lọc theo thương hiệu">
        <option value="">Tất cả thương hiệu</option>
      </select>
      <select id="priceFilter" onchange="filterProducts()" title="Lọc theo mức giá">
        <option value="">Tất cả giá</option>
        <option value="low">Dưới 5 triệu</option>
        <option value="mid">5 - 15 triệu</option>
        <option value="high">Trên 15 triệu</option>
      </select>
    </div>

    <div class="products-grid" id="products-grid">
      <!-- Sản phẩm sẽ được load bằng JS -->
    </div>
  </div>

  <!-- Modal Giỏ hàng -->
  <div class="cart-modal" id="cart-modal">
    <div class="cart-content">
      <h2>Giỏ hàng của bạn</h2>
      <div id="cart-items"></div>
      <h3 style="margin-top:20px;">Tổng tiền: <span id="cart-total">0</span> VNĐ</h3>
      <div style="margin-top:20px; display:flex; gap:10px;">
        <button onclick="hideCart()" style="flex:1; padding:12px; background:#666; color:white; border:none; border-radius:8px;">Đóng</button>
        <button onclick="checkout()" style="flex:1; padding:12px; background:#e63939; color:white; border:none; border-radius:8px;">Thanh toán</button>
      </div>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 WatchStore - Cửa hàng đồng hồ chính hãng tại Hải Phòng</p>
  </footer>

  <script>
    // === Firebase Config (bạn cung cấp) ===
    const firebaseConfig = {
      apiKey: "AIzaSyCjxu5VM_FU39wHu2kwVHuw6WMLqpshvw8",
      authDomain: "watch-store-8330b.firebaseapp.com",
      projectId: "watch-store-8330b",
      storageBucket: "watch-store-8330b.firebasestorage.app",
      messagingSenderId: "473256087916",
      appId: "1:473256087916:web:fc82fd400ba3dff01ce349",
      measurementId: "G-5DFX112P5C"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let products = [];
    let cart = JSON.parse(localStorage.getItem('cart')) || [];

    // Load sản phẩm từ Firestore
    async function loadProducts() {
      const snapshot = await db.collection("products").get();
      products = [];
      snapshot.forEach(doc => {
        products.push({ id: doc.id, ...doc.data() });
      });

      // Tạo danh sách thương hiệu động
      const brands = [...new Set(products.map(p => p.brand))];
      const brandSelect = document.getElementById('brandFilter');
      brands.forEach(brand => {
        const opt = document.createElement('option');
        opt.value = brand;
        opt.textContent = brand;
        brandSelect.appendChild(opt);
      });

      renderProducts(products);
    }

    // Render sản phẩm
    function renderProducts(filteredProducts) {
      const grid = document.getElementById('products-grid');
      grid.innerHTML = '';

      filteredProducts.forEach(product => {
        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
          <img src="${product.image || 'https://via.placeholder.com/300x280?text=Watch'}" alt="${product.name}">
          <div class="product-info">
            <span class="brand">${product.brand}</span>
            <h3>${product.name}</h3>
            <div class="price">${Number(product.price).toLocaleString('vi-VN')} VNĐ</div>
            <p style="font-size:0.9rem; color:#666; margin:10px 0;">${product.description || ''}</p>
            <button class="add-to-cart" onclick="addToCart('${product.id}')">Thêm vào giỏ</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Thêm vào giỏ
    function addToCart(productId) {
      const product = products.find(p => p.id === productId);
      if (!product) return;

      const existing = cart.find(item => item.id === product.id);
      if (existing) {
        existing.quantity += 1;
      } else {
        cart.push({ ...product, quantity: 1 });
      }

      localStorage.setItem('cart', JSON.stringify(cart));
      updateCartCount();
      alert(`${product.name} đã được thêm vào giỏ hàng!`);
    }

    function updateCartCount() {
      const count = cart.reduce((sum, item) => sum + item.quantity, 0);
      document.getElementById('cart-count').textContent = count;
    }

    // Hiển thị giỏ hàng
    function showCart() {
      const modal = document.getElementById('cart-modal');
      const itemsDiv = document.getElementById('cart-items');
      let html = '';
      let total = 0;

      cart.forEach((item, index) => {
        const itemTotal = item.price * item.quantity;
        total += itemTotal;
        html += `
          <div style="display:flex; justify-content:space-between; align-items:center; margin:15px 0; padding-bottom:15px; border-bottom:1px solid #eee;">
            <div>
              <strong>${item.name}</strong><br>
              <small>${item.brand} × ${item.quantity}</small>
            </div>
            <div style="text-align:right;">
              <div>${itemTotal.toLocaleString('vi-VN')} VNĐ</div>
              <button onclick="removeFromCart(${index})" style="background:none; border:none; color:#e63939; cursor:pointer;">Xóa</button>
            </div>
          </div>
        `;
      });

      itemsDiv.innerHTML = html || '<p>Giỏ hàng trống</p>';
      document.getElementById('cart-total').textContent = total.toLocaleString('vi-VN');
      modal.style.display = 'flex';
    }

    function hideCart() {
      document.getElementById('cart-modal').style.display = 'none';
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      localStorage.setItem('cart', JSON.stringify(cart));
      updateCartCount();
      showCart();
    }

    function checkout() {
      if (cart.length === 0) return alert("Giỏ hàng trống!");
      alert("Cảm ơn bạn đã mua hàng! (Chức năng thanh toán sẽ được tích hợp sau)");
      cart = [];
      localStorage.setItem('cart', JSON.stringify(cart));
      updateCartCount();
      hideCart();
    }

    // Lọc sản phẩm
    function filterProducts() {
      const searchTerm = document.getElementById('search').value.toLowerCase();
      const brand = document.getElementById('brandFilter').value;
      const priceFilter = document.getElementById('priceFilter').value;

      let filtered = products.filter(product => {
        const matchSearch = product.name.toLowerCase().includes(searchTerm) || 
                           (product.brand && product.brand.toLowerCase().includes(searchTerm));
        const matchBrand = !brand || product.brand === brand;

        let matchPrice = true;
        if (priceFilter === 'low') matchPrice = product.price < 5000000;
        else if (priceFilter === 'mid') matchPrice = product.price >= 5000000 && product.price <= 15000000;
        else if (priceFilter === 'high') matchPrice = product.price > 15000000;

        return matchSearch && matchBrand && matchPrice;
      });

      renderProducts(filtered);
    }

    // Khởi chạy
    window.onload = () => {
      loadProducts();
      updateCartCount();
    };
  </script>
</body>
</html>
