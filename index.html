<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WatchStore - Đồng Hồ Cao Cấp</title>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <style>
    :root { --primary: #c3996b; --dark: #111; }
    body { font-family: 'Segoe UI', sans-serif; background: #f8f1e9; margin:0; }
    header { background: var(--dark); color: white; padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 1.8rem; font-weight: bold; color: var(--primary); }
    .auth-btn { background: var(--primary); color: white; padding: 10px 20px; border-radius: 30px; border: none; cursor: pointer; }
    .admin-btn { background: #e63939; color: white; padding: 10px 20px; border-radius: 30px; text-decoration: none; }
  </style>
</head>
<body>
  <header>
    <div class="logo">WatchStore ⌚</div>
    <div id="auth-section"></div>
  </header>

  <div style="max-width:1200px; margin:40px auto; padding:0 5%; text-align:center;">
    <h1>Đồng Hồ Cao Cấp</h1>
    <p>Khám phá bộ sưu tập sang trọng nhất 2026</p>
    <div id="products-grid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:25px; margin-top:40px;"></div>
  </div>

  <script>
    const firebaseConfig = { /* Config của bạn */ 
      apiKey: "AIzaSyCjxu5VM_FU39wHu2kwVHuw6WMLqpshvw8",
      authDomain: "watch-store-8330b.firebaseapp.com",
      projectId: "watch-store-8330b",
      storageBucket: "watch-store-8330b.firebasestorage.app",
      messagingSenderId: "473256087916",
      appId: "1:473256087916:web:fc82fd400ba3dff01ce349"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    auth.onAuthStateChanged(user => {
      const section = document.getElementById("auth-section");
      if (user) {
        section.innerHTML = `<span style="margin-right:15px;">${user.email}</span><button class="auth-btn" onclick="logout()">Đăng xuất</button>`;
      } else {
        section.innerHTML = `<button class="auth-btn" onclick="showLogin()">Đăng nhập / Đăng ký</button>`;
      }
      loadProducts();
    });

    function showLogin() { alert("Modal đăng nhập sẽ được mở (bạn có thể mở rộng sau)"); }
    function logout() { auth.signOut(); }

    async function loadProducts() {
      const grid = document.getElementById("products-grid");
      grid.innerHTML = "";
      const snap = await db.collection("products").get();
      snap.forEach(doc => {
        const p = doc.data();
        const div = document.createElement("div");
        div.style.border = "1px solid #ddd"; div.style.padding = "15px"; div.style.borderRadius = "10px";
        div.innerHTML = `<h3>${p.name}</h3><p>${p.brand} - ${Number(p.price).toLocaleString('vi-VN')} ₫</p>`;
        grid.appendChild(div);
      });
    }
  </script>
</body>
</html>
