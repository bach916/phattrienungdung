<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WatchStore - Đồng Hồ Cao Cấp</title>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <style>
    :root { --primary: #c3996b; --dark: #111; }
    body { font-family: 'Segoe UI', sans-serif; background: #f8f1e9; margin:0; }
    header { background: var(--dark); color: white; padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
    .logo { font-size: 1.8rem; font-weight: bold; color: var(--primary); }
    .auth-btn, .cart-btn { background: var(--primary); color: white; padding: 10px 20px; border-radius: 30px; border: none; cursor: pointer; margin-left: 10px; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; z-index: 2000; }
    .modal-content { background: white; padding: 2rem; border-radius: 15px; width: 90%; max-width: 600px; max-height: 90vh; overflow-y: auto; }
  </style>
</head>
<body>

  <header>
    <div class="logo">WatchStore ⌚</div>
    <div id="auth-section"></div>
    <button class="cart-btn" onclick="showCart()">🛒 Giỏ hàng (<span id="cart-count">0</span>)</button>
  </header>

  <div style="max-width:1200px; margin:40px auto; padding:0 5%; text-align:center;">
    <h1>Đồng Hồ Cao Cấp</h1>
    <p>Khám phá bộ sưu tập sang trọng nhất 2026</p>
    <div id="products-grid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:25px; margin-top:40px;"></div>
  </div>

  <!-- Modal Giỏ hàng -->
  <div id="cart-modal" class="modal">
    <div class="modal-content">
      <h2>Giỏ hàng của bạn</h2>
      <div id="cart-items"></div>
      <h3>Tổng tiền: <span id="cart-total">0</span> VNĐ</h3>
      <div style="margin-top:20px;">
        <button onclick="hideCart()" style="padding:12px 30px; background:#666; color:white; border:none; border-radius:8px; margin-right:10px;">Đóng</button>
        <button onclick="checkout()" style="padding:12px 30px; background:#e63939; color:white; border:none; border-radius:8px;">Thanh toán ngay</button>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCjxu5VM_FU39wHu2kwVHuw6WMLqpshvw8",
      authDomain: "watch-store-8330b.firebaseapp.com",
      projectId: "watch-store-8330b",
      storageBucket: "watch-store-8330b.firebasestorage.app",
      messagingSenderId: "473256087916",
      appId: "1:473256087916:web:fc82fd400ba3dff01ce349"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let cart = JSON.parse(localStorage.getItem('cart')) || [];

    auth.onAuthStateChanged(user => {
      const section = document.getElementById("auth-section");
      if (user) {
        section.innerHTML = `<span style="margin-right:15px;">${user.email}</span><button class="auth-btn" onclick="logout()">Đăng xuất</button>`;
      } else {
        section.innerHTML = `<button class="auth-btn" onclick="showLoginModal()">Đăng nhập</button>`;
      }
      loadProducts();
      updateCartCount();
    });

    // ==================== GIỎ HÀNG ====================
    function addToCart(productId) {
      const product = products.find(p => p.id === productId);
      if (!product) return;

      const existing = cart.find(item => item.id === product.id);
      if (existing) {
        existing.quantity += 1;
      } else {
        cart.push({ ...product, quantity: 1 });
      }
      localStorage.setItem('cart', JSON.stringify(cart));
      updateCartCount();
      alert(`${product.name} đã được thêm vào giỏ hàng!`);
    }

    function updateCartCount() {
      const count = cart.reduce((sum, item) => sum + item.quantity, 0);
      document.getElementById("cart-count").textContent = count;
    }

    function showCart() {
      const modal = document.getElementById("cart-modal");
      const itemsDiv = document.getElementById("cart-items");
      let html = '';
      let total = 0;

      cart.forEach((item, index) => {
        const itemTotal = item.price * item.quantity;
        total += itemTotal;
        html += `
          <div style="display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #eee;">
            <div>
              <strong>${item.name}</strong><br>
              <small>${item.brand} × ${item.quantity}</small>
            </div>
            <div style="text-align:right;">
              <div>${itemTotal.toLocaleString('vi-VN')} ₫</div>
              <button onclick="removeFromCart(${index})" style="color:red; background:none; border:none; cursor:pointer;">Xóa</button>
            </div>
          </div>`;
      });

      itemsDiv.innerHTML = html || '<p>Giỏ hàng trống</p>';
      document.getElementById("cart-total").textContent = total.toLocaleString('vi-VN');
      modal.style.display = "flex";
    }

    function hideCart() {
      document.getElementById("cart-modal").style.display = "none";
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      localStorage.setItem('cart', JSON.stringify(cart));
      updateCartCount();
      showCart();
    }

    function checkout() {
      if (cart.length === 0) return alert("Giỏ hàng trống!");
      if (!auth.currentUser) return alert("Vui lòng đăng nhập để thanh toán!");

      alert("✅ Thanh toán thành công! Cảm ơn bạn đã mua hàng.");

      // Lưu đơn hàng vào Firestore
      db.collection("orders").add({
        userId: auth.currentUser.uid,
        email: auth.currentUser.email,
        items: cart,
        total: cart.reduce((sum, item) => sum + item.price * item.quantity, 0),
        timestamp: new Date()
      });

      cart = [];
      localStorage.setItem('cart', JSON.stringify(cart));
      updateCartCount();
      hideCart();
    }

    // ==================== SẢN PHẨM ====================
    let products = [];
    async function loadProducts() {
      const snap = await db.collection("products").get();
      products = [];
      snap.forEach(doc => products.push({ id: doc.id, ...doc.data() }));

      const grid = document.getElementById("products-grid");
      grid.innerHTML = "";
      products.forEach(p => {
        const div = document.createElement("div");
        div.style.border = "1px solid #ddd"; div.style.padding = "15px"; div.style.borderRadius = "10px";
        div.innerHTML = `
          <h3>${p.name}</h3>
          <p>${p.brand} - ${Number(p.price).toLocaleString('vi-VN')} ₫</p>
          <button onclick="addToCart('${p.id}')" style="width:100%; padding:10px; background:var(--primary); color:white; border:none; border-radius:8px;">Thêm vào giỏ</button>
        `;
        grid.appendChild(div);
      });
    }

    function logout() { auth.signOut(); }
    function showLoginModal() { alert("Modal đăng nhập (bạn có thể mở rộng sau)"); }

    window.onload = () => {};
  </script>
</body>
</html>
