<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WatchStore - Đồng Hồ Cao Cấp</title>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <style>
    :root { --primary: #c3996b; --dark: #111; }
    body { font-family: 'Segoe UI', sans-serif; background: #f8f1e9; margin:0; }
    header { background: var(--dark); color: white; padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 1.8rem; font-weight: bold; color: var(--primary); }
    .auth-btn { background: var(--primary); color: white; padding: 10px 20px; border-radius: 30px; border: none; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <div class="logo">WatchStore ⌚</div>
    <div id="auth-section">
      <button class="auth-btn" onclick="showLoginModal()">Đăng nhập</button>
    </div>
  </header>

  <div style="max-width:1200px; margin:40px auto; padding:0 5%;">
    <h1 style="text-align:center;">Chào mừng đến WatchStore</h1>
    <div id="products-grid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:25px; margin-top:30px;"></div>
  </div>

  <!-- Modal Đăng nhập / Đăng ký (giống trước) -->
  <div id="auth-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); align-items:center; justify-content:center;">
    <div style="background:white; padding:2rem; border-radius:15px; width:90%; max-width:420px;">
      <h3>Đăng nhập / Đăng ký</h3>
      <input type="email" id="email" placeholder="Email" style="width:100%; padding:12px; margin:10px 0;">
      <input type="password" id="password" placeholder="Mật khẩu" style="width:100%; padding:12px; margin:10px 0;">
      <button onclick="handleAuth()" id="auth-btn-main" style="width:100%; padding:12px; background:var(--primary); color:white; border:none;">Đăng nhập</button>
      <p onclick="toggleMode()" id="toggle-text" style="text-align:center; cursor:pointer; color:var(--primary);">Chưa có tài khoản? Đăng ký</p>
      <button onclick="hideModal()" style="width:100%; padding:10px; background:#666; color:white; border:none; margin-top:10px;">Đóng</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCjxu5VM_FU39wHu2kwVHuw6WMLqpshvw8",
      authDomain: "watch-store-8330b.firebaseapp.com",
      projectId: "watch-store-8330b",
      storageBucket: "watch-store-8330b.firebasestorage.app",
      messagingSenderId: "473256087916",
      appId: "1:473256087916:web:fc82fd400ba3dff01ce349"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;
    let isAdmin = false;
    let isRegisterMode = false;

    // Kiểm tra đăng nhập
    auth.onAuthStateChanged(async (user) => {
      currentUser = user;
      if (user) {
        const idTokenResult = await user.getIdTokenResult();
        isAdmin = idTokenResult.claims.role === "admin";

        if (isAdmin) {
          window.location.href = "admin.html";   // Chuyển sang trang admin
          return;
        }

        // Nếu là khách hàng bình thường
        document.getElementById("auth-section").innerHTML = `
          <span style="margin-right:15px;">${user.email}</span>
          <button class="auth-btn" onclick="logout()">Đăng xuất</button>
        `;
        loadProducts();
      } else {
        document.getElementById("auth-section").innerHTML = `<button class="auth-btn" onclick="showLoginModal()">Đăng nhập</button>`;
        loadProducts();
      }
    });

    function showLoginModal() {
      document.getElementById("auth-modal").style.display = "flex";
      isRegisterMode = false;
      updateAuthUI();
    }

    function hideModal() {
      document.getElementById("auth-modal").style.display = "none";
    }

    function toggleMode() {
      isRegisterMode = !isRegisterMode;
      updateAuthUI();
    }

    function updateAuthUI() {
      document.getElementById("auth-btn-main").textContent = isRegisterMode ? "Đăng ký" : "Đăng nhập";
      document.getElementById("toggle-text").textContent = isRegisterMode 
        ? "Đã có tài khoản? Đăng nhập" 
        : "Chưa có tài khoản? Đăng ký";
    }

    async function handleAuth() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        if (isRegisterMode) {
          const cred = await auth.createUserWithEmailAndPassword(email, password);
          await db.collection("users").doc(cred.user.uid).set({ email, role: "customer", createdAt: new Date() });
          alert("Đăng ký thành công!");
        } else {
          await auth.signInWithEmailAndPassword(email, password);
        }
        hideModal();
      } catch (e) {
        alert("Lỗi: " + e.message);
      }
    }

    function logout() {
      auth.signOut();
    }

    async function loadProducts() {
      const snap = await db.collection("products").get();
      const grid = document.getElementById("products-grid");
      grid.innerHTML = "";
      snap.forEach(doc => {
        const p = doc.data();
        const div = document.createElement("div");
        div.style.border = "1px solid #ddd";
        div.style.padding = "15px";
        div.style.borderRadius = "10px";
        div.innerHTML = `
          <img src="${p.image || 'https://via.placeholder.com/300'}" style="width:100%; height:200px; object-fit:cover;">
          <h3>${p.name}</h3>
          <p>${p.brand} - ${Number(p.price).toLocaleString('vi-VN')} ₫</p>
          <button onclick="addToCart('${doc.id}')" style="background:var(--primary); color:white; border:none; padding:8px 15px;">Thêm vào giỏ</button>
        `;
        grid.appendChild(div);
      });
    }

    function addToCart(id) {
      if (!currentUser) return alert("Vui lòng đăng nhập!");
      alert("Đã thêm vào giỏ hàng (chức năng sẽ hoàn thiện sau)");
    }

    window.onload = () => {};
  </script>
</body>
</html>
