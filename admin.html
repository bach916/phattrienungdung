<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WatchStore - Admin Dashboard</title>
  
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f8f1e9; margin:0; }
    header { background:#111; color:white; padding:1rem 5%; display:flex; justify-content:space-between; align-items:center; }
    .logo { font-size:1.8rem; color:#c3996b; font-weight:bold; }
    .container { max-width:1200px; margin:30px auto; padding:0 5%; }
    .panel { background:white; padding:30px; border-radius:15px; box-shadow:0 5px 20px rgba(0,0,0,0.1); }
    input, button { width:100%; padding:12px; margin:8px 0; border-radius:8px; }
    button { background:#c3996b; color:white; border:none; font-weight:bold; cursor:pointer; }
  </style>
</head>
<body>

  <header>
    <div class="logo">WatchStore - Admin</div>
    <button onclick="logout()" style="background:#e63939; color:white; border:none; padding:10px 20px; border-radius:8px;">Đăng xuất</button>
  </header>

  <div class="container">
    <div class="panel">
      <h2>🔧 Admin Dashboard</h2>
      <p><strong>Xin chào Admin! (Đã bỏ kiểm tra quyền)</strong></p>

      <h3>Thêm sản phẩm mới</h3>
      <input type="text" id="name" placeholder="Tên đồng hồ">
      <input type="text" id="brand" placeholder="Thương hiệu">
      <input type="number" id="price" placeholder="Giá (VNĐ)">
      <input type="text" id="image" placeholder="Link ảnh sản phẩm">
      <button onclick="addProduct()">Thêm sản phẩm</button>

      <h3 style="margin-top:40px;">Danh sách sản phẩm</h3>
      <div id="product-list" style="margin-top:20px;"></div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCjxu5VM_FU39wHu2kwVHuw6WMLqpshvw8",
      authDomain: "watch-store-8330b.firebaseapp.com",
      projectId: "watch-store-8330b",
      storageBucket: "watch-store-8330b.firebasestorage.app",
      messagingSenderId: "473256087916",
      appId: "1:473256087916:web:fc82fd400ba3dff01ce349"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // BỎ KIỂM TRA QUYỀN - AI ĐĂNG NHẬP CŨNG VÀO ĐƯỢC
    auth.onAuthStateChanged(user => {
      if (!user) {
        alert("Vui lòng đăng nhập!");
        window.location.href = "index.html";
        return;
      }
      console.log("✅ Vào Admin thành công với UID:", user.uid);
      loadAdminProducts();
    });

    async function addProduct() {
      const product = {
        name: document.getElementById("name").value,
        brand: document.getElementById("brand").value,
        price: Number(document.getElementById("price").value),
        image: document.getElementById("image").value || "https://via.placeholder.com/300",
        createdAt: new Date()
      };

      if (!product.name || !product.brand || !product.price) {
        alert("Vui lòng nhập đầy đủ thông tin!");
        return;
      }

      await db.collection("products").add(product);
      alert("✅ Thêm sản phẩm thành công!");
      loadAdminProducts();
      
      // Xóa form
      document.getElementById("name").value = "";
      document.getElementById("brand").value = "";
      document.getElementById("price").value = "";
      document.getElementById("image").value = "";
    }

    async function loadAdminProducts() {
      const snap = await db.collection("products").get();
      let html = `<table border="1" width="100%" style="border-collapse:collapse;">
                    <tr><th>Tên</th><th>Thương hiệu</th><th>Giá</th><th>Hành động</th></tr>`;
      snap.forEach(doc => {
        const p = doc.data();
        html += `<tr>
          <td>${p.name}</td>
          <td>${p.brand}</td>
          <td>${Number(p.price).toLocaleString('vi-VN')} ₫</td>
          <td><button onclick="deleteProduct('${doc.id}')" style="color:red;">Xóa</button></td>
        </tr>`;
      });
      html += "</table>";
      document.getElementById("product-list").innerHTML = html || "<p>Chưa có sản phẩm nào.</p>";
    }

    async function deleteProduct(id) {
      if (confirm("Xóa sản phẩm này?")) {
        await db.collection("products").doc(id).delete();
        loadAdminProducts();
      }
    }

    function logout() {
      auth.signOut().then(() => window.location.href = "index.html");
    }
  </script>
</body>
</html>
