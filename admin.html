<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Admin - Quản Lý Kho Hàng</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-10">

    <div class="max-w-5xl mx-auto">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-black text-slate-800">HỆ THỐNG QUẢN TRỊ</h1>
            <a href="index.html" class="text-blue-600 hover:underline"><i class="fa-solid fa-arrow-left"></i> Xem cửa hàng</a>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="bg-white p-6 rounded-2xl shadow-sm h-fit sticky top-10">
                <h2 id="form-title" class="text-xl font-bold mb-6 text-blue-600">Thêm sản phẩm mới</h2>
                <form id="product-form" class="space-y-4">
                    <input type="hidden" id="product-id">
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Tên đồng hồ</label>
                        <input type="text" id="name" class="w-full border-2 border-gray-100 p-3 rounded-xl focus:border-blue-500 outline-none" required>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Giá (VNĐ)</label>
                        <input type="number" id="price" class="w-full border-2 border-gray-100 p-3 rounded-xl focus:border-blue-500 outline-none" required>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Link ảnh</label>
                        <input type="text" id="image" class="w-full border-2 border-gray-100 p-3 rounded-xl focus:border-blue-500 outline-none" required>
                    </div>
                    <div class="flex gap-2">
                        <button type="submit" id="btn-submit" class="flex-grow bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition">LƯU SẢN PHẨM</button>
                        <button type="button" id="btn-cancel" class="hidden bg-gray-200 text-gray-600 px-4 rounded-xl hover:bg-gray-300" onclick="resetForm()">Hủy</button>
                    </div>
                </form>
            </div>

            <div class="lg:col-span-2">
                <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
                    <table class="w-full text-left">
                        <thead class="bg-slate-900 text-white text-sm uppercase">
                            <tr>
                                <th class="p-4">Ảnh</th>
                                <th class="p-4">Thông tin</th>
                                <th class="p-4 text-right">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="admin-product-list" class="divide-y divide-gray-100">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCjxu5VM_FU39wHu2kwVHuw6WMLqpshvw8",
            authDomain: "watch-store-8330b.firebaseapp.com",
            projectId: "watch-store-8330b",
            storageBucket: "watch-store-8330b.firebasestorage.app",
            messagingSenderId: "473256087916",
            appId: "1:473256087916:web:fc82fd400ba3dff01ce349"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const productList = document.getElementById('admin-product-list');
        const productForm = document.getElementById('product-form');

        // 1. HIỂN THỊ DANH SÁCH & LẮNG NGHE THAY ĐỔI
        onSnapshot(collection(db, "watches"), (snapshot) => {
            productList.innerHTML = "";
            snapshot.forEach((val) => {
                const item = val.data();
                productList.innerHTML += `
                    <tr class="hover:bg-slate-50 transition">
                        <td class="p-4"><img src="${item.image}" class="w-16 h-16 object-cover rounded-lg border"></td>
                        <td class="p-4">
                            <p class="font-bold text-slate-800">${item.name}</p>
                            <p class="text-blue-600 text-sm font-semibold">${item.price.toLocaleString()}đ</p>
                        </td>
                        <td class="p-4 text-right space-x-2">
                            <button onclick="editProduct('${val.id}', '${item.name}', ${item.price}, '${item.image}')" class="text-amber-500 hover:bg-amber-50 p-2 rounded-lg transition"><i class="fa-solid fa-pen-to-square"></i> Sửa</button>
                            <button onclick="deleteProduct('${val.id}')" class="text-red-500 hover:bg-red-50 p-2 rounded-lg transition"><i class="fa-solid fa-trash"></i> Xóa</button>
                        </td>
                    </tr>
                `;
            });
        });

        // 2. XỬ LÝ THÊM HOẶC CẬP NHẬT
        productForm.onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('product-id').value;
            const data = {
                name: document.getElementById('name').value,
                price: Number(document.getElementById('price').value),
                image: document.getElementById('image').value
            };

            try {
                if (id) {
                    // Cập nhật sản phẩm cũ
                    await updateDoc(doc(db, "watches", id), data);
                    alert("Đã cập nhật thành công!");
                } else {
                    // Thêm sản phẩm mới
                    await addDoc(collection(db, "watches"), data);
                    alert("Đã thêm sản phẩm mới!");
                }
                resetForm();
            } catch (err) { alert("Lỗi: " + err.message); }
        };

        // 3. XÓA SẢN PHẨM
        window.deleteProduct = async (id) => {
            if (confirm("Bạn có chắc chắn muốn xóa sản phẩm này không?")) {
                await deleteDoc(doc(db, "watches", id));
            }
        };

        // 4. CHUẨN BỊ SỬA SẢN PHẨM
        window.editProduct = (id, name, price, image) => {
            document.getElementById('product-id').value = id;
            document.getElementById('name').value = name;
            document.getElementById('price').value = price;
            document.getElementById('image').value = image;
            
            document.getElementById('form-title').innerText = "Đang sửa sản phẩm";
            document.getElementById('btn-submit').innerText = "CẬP NHẬT NGAY";
            document.getElementById('btn-cancel').classList.remove('hidden');
        };

        // 5. RESET FORM
        window.resetForm = () => {
            productForm.reset();
            document.getElementById('product-id').value = "";
            document.getElementById('form-title').innerText = "Thêm sản phẩm mới";
            document.getElementById('btn-submit').innerText = "LƯU SẢN PHẨM";
            document.getElementById('btn-cancel').classList.add('hidden');
        };
    </script>
</body>
</html>
