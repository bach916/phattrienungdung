<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý kho hàng</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 min-h-screen p-6">
    <div class="max-w-6xl mx-auto">
        <div class="flex justify-between items-center mb-10">
            <h1 class="text-2xl font-black">HỆ THỐNG QUẢN TRỊ</h1>
            <div class="space-x-4">
                <a href="index.html" class="text-blue-600 font-bold underline">Xem Shop</a>
                <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-lg shadow-red-200">Đăng xuất</button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-10">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 h-fit">
                <h2 id="form-title" class="text-lg font-bold mb-6 text-blue-600 uppercase">Thêm sản phẩm</h2>
                <form id="p-form" class="space-y-4">
                    <input type="hidden" id="p-id">
                    <input type="text" id="p-name" placeholder="Tên đồng hồ" class="w-full border p-3 rounded-xl outline-none focus:border-blue-500" required>
                    <input type="number" id="p-price" placeholder="Giá VNĐ" class="w-full border p-3 rounded-xl outline-none focus:border-blue-500" required>
                    <input type="text" id="p-image" placeholder="Link ảnh (URL)" class="w-full border p-3 rounded-xl outline-none focus:border-blue-500" required>
                    <div class="flex gap-2">
                        <button type="submit" id="btn-save" class="flex-grow bg-blue-600 text-white py-3 rounded-xl font-bold">LƯU LẠI</button>
                        <button type="button" id="btn-cancel" class="hidden bg-gray-200 px-4 rounded-xl" onclick="resetF()">Hủy</button>
                    </div>
                </form>
            </div>

            <div class="lg:col-span-2 bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                <table class="w-full text-left">
                    <thead class="bg-slate-900 text-white text-xs uppercase">
                        <tr>
                            <th class="p-4">Sản phẩm</th>
                            <th class="p-4">Giá</th>
                            <th class="p-4 text-right">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="p-list" class="divide-y divide-gray-50 text-sm"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const auth = getAuth(app);

// Kiểm tra trạng thái đăng nhập
onAuthStateChanged(auth, (user) => {
    if (!user) {
        // Nếu không có user, quay lại trang login
        window.location.href = "login.html";
    }
});

// Thêm chức năng Đăng xuất (Tùy chọn)
window.logout = () => {
    signOut(auth).then(() => {
        window.location.href = "login.html";
    });
};
// Kiểm tra trạng thái đăng nhập
onAuthStateChanged(auth, (user) => {
    if (!user) {
        // Nếu không có user, quay lại trang login
        window.location.href = "login.html";
    }
});

// Thêm chức năng Đăng xuất (Tùy chọn)
window.logout = () => {
    signOut(auth).then(() => {
        window.location.href = "login.html";
    });
};

        // HIỂN THỊ DANH SÁCH
        onSnapshot(collection(db, "watches"), (snap) => {
            const list = document.getElementById('p-list');
            list.innerHTML = "";
            snap.forEach(d => {
                const item = d.data();
                list.innerHTML += `
                    <tr>
                        <td class="p-4 flex items-center gap-3">
                            <img src="${item.image}" class="w-12 h-12 object-cover rounded-md border">
                            <span class="font-bold">${item.name}</span>
                        </td>
                        <td class="p-4 font-semibold text-blue-600">${item.price.toLocaleString()}đ</td>
                        <td class="p-4 text-right space-x-2">
                            <button onclick="prepEdit('${d.id}', '${item.name}', ${item.price}, '${item.image}')" class="text-amber-500 hover:underline">Sửa</button>
                            <button onclick="delP('${d.id}')" class="text-red-500 hover:underline">Xóa</button>
                        </td>
                    </tr>
                `;
            });
        });

        // THÊM/SỬA
        document.getElementById('p-form').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('p-id').value;
            const data = {
                name: document.getElementById('p-name').value,
                price: Number(document.getElementById('p-price').value),
                image: document.getElementById('p-image').value
            };
            if(id) await updateDoc(doc(db, "watches", id), data);
            else await addDoc(collection(db, "watches"), data);
            resetF();
        };

        window.delP = async (id) => { if(confirm("Xóa sản phẩm này?")) await deleteDoc(doc(db, "watches", id)); };
        window.prepEdit = (id, n, p, i) => {
            document.getElementById('p-id').value = id;
            document.getElementById('p-name').value = n;
            document.getElementById('p-price').value = p;
            document.getElementById('p-image').value = i;
            document.getElementById('form-title').innerText = "Đang chỉnh sửa";
            document.getElementById('btn-cancel').classList.remove('hidden');
        };
        window.resetF = () => {
            document.getElementById('p-form').reset();
            document.getElementById('p-id').value = "";
            document.getElementById('form-title').innerText = "Thêm sản phẩm";
            document.getElementById('btn-cancel').classList.add('hidden');
        };
    </script>
</body>
</html>
