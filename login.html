<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-sm text-center">
        <h2 class="text-2xl font-black mb-6 uppercase tracking-wider">Hệ thống Admin</h2>
        <form id="login-form" class="space-y-4 text-left">
            <div>
                <label class="block text-xs font-bold text-gray-400 mb-1 uppercase">Email</label>
                <input type="email" id="email" class="w-full border p-3 rounded-xl outline-none focus:ring-2 focus:ring-blue-500" placeholder="admin@gmail.com" required>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-400 mb-1 uppercase">Mật khẩu</label>
                <input type="password" id="password" class="w-full border p-3 rounded-xl outline-none focus:ring-2 focus:ring-blue-500" placeholder="••••••" required>
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition duration-300">ĐĂNG NHẬP</button>
        </form>
        <p id="error-msg" class="text-red-500 mt-4 text-sm hidden">Sai tài khoản hoặc mật khẩu!</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = { /* Dán cấu hình của bạn ở đây */
            apiKey: "AIzaSyCjxu5VM_FU39wHu2kwVHuw6WMLqpshvw8",
            authDomain: "watch-store-8330b.firebaseapp.com",
            projectId: "watch-store-8330b",
            storageBucket: "watch-store-8330b.firebasestorage.app",
            messagingSenderId: "473256087916",
            appId: "1:473256087916:web:fc82fd400ba3dff01ce349"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        document.getElementById('login-form').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');

            try {
                await signInWithEmailAndPassword(auth, email, password);
                // Đăng nhập thành công, chuyển hướng sang admin
                window.location.href = "admin.html";
            } catch (error) {
                errorMsg.classList.remove('hidden');
                console.error(error.message);
            }
        };
    </script>
</body>
</html>
